<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
</div>
    <script>
        async function addItem() {
            const newItemInput = document.getElementById('newItem');
            const newItemText = newItemInput.value.trim();

<script>
    let items = [];
    let nextId = 1;
            if (newItemText) {
                try {
                    const response = await fetch('/add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ text: newItemText })
                    });

                    if (response.ok) {
                        window.location.reload();
                    } else {
                        alert('Failed to add item');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while adding the item');
                }
            } else {
                alert('Please enter a task');
            }
        }

    function renderList() {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';
        async function deleteItem(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                try {
                    const response = await fetch(`/delete/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        window.location.reload();
                    } else {
                        alert('Failed to delete item');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while deleting the item');
                }
            }
        }

        items.forEach((item, index) => {
            const row = document.createElement('tr');
        function enableEdit(id, currentText) {
            const row = document.getElementById(`row-${id}`);
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.text}</td>
                <td><button onclick="removeItem(${index})">Remove</button></td>
                <td>${row.cells[0].textContent}</td>
                <td><input type="text" id="edit-input-${id}" class="edit-input" value="${currentText}"></td>
                <td>
                    <button class="action-btn save-btn" onclick="saveEdit(${id})">Save</button>
                    <button class="action-btn cancel-btn" onclick="cancelEdit(${id}, '${currentText}')">Cancel</button>
                </td>
            `;
            listBody.appendChild(row);
        });
    }
            document.getElementById(`edit-input-${id}`).focus();
        }

    function addItem() {
        const newItemInput = document.getElementById('newItem');
        const newItemText = newItemInput.value.trim();
        async function saveEdit(id) {
            const newText = document.getElementById(`edit-input-${id}`).value.trim();
            if (!newText) {
                alert('Task cannot be empty');
                return;
            }

        if (newItemText) {
            items.push({ id: nextId++, text: newItemText });
            newItemInput.value = '';
            renderList();
            try {
                const response = await fetch(`/edit/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: newText })
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to update item');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while updating the item');
            }
        }
    }

    function removeItem(index) {
        items.splice(index, 1);
        renderList();
    }
</script>

        function cancelEdit(id, originalText) {
            const row = document.getElementById(`row-${id}`);
            row.innerHTML = `
                <td>${row.cells[0].textContent}</td>
                <td>${originalText}</td>
                <td>
                    <button class="action-btn edit-btn" onclick="enableEdit(${id}, '${originalText}')">Edit</button>
                    <button class="action-btn delete-btn" onclick="deleteItem(${id})">Delete</button>
                </td>
            `;
        }
    </script>
